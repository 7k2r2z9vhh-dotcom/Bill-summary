<script type="text/babel">
const { useState, useMemo, useEffect } = React;

const SK  = "bill_data", SI = "bill_nextid", SC = "bill_cats", SS = "bill_salary";
const defaultCats = [
  {name:"Carry Over Y68",color:"#f97316"},{name:"Repair",color:"var(--red)"},
  {name:"Worker House",color:"#8b5cf6"},{name:"Materials",color:"var(--blue)"},
  {name:"Utilities",color:"var(--green)"},{name:"Internet",color:"var(--blue)"},{name:"Others",color:"#6b7280"},
];
const defaultData = [
  {id:1,date:"6/1/69",amount:15000,deduct:0,description:"ค่าล้อสัมภาระ ปี 68",category:"Carry Over Y68"},
  {id:2,date:"16/1/69",amount:1926,deduct:0,description:"กา. คุณหมาเครื่องตู้หน้า 2H",category:"Repair"},
  {id:3,date:"16/1/69",amount:153,deduct:0,description:"สร. Worker House",category:"Worker House"},
  {id:4,date:"19/1/69",amount:1920,deduct:0,description:"สร. เหล็กเพิ่ก บนปลวก หน้าหม้อน้ำ",category:"Materials"},
  {id:5,date:"23/1/69",amount:2400,deduct:0,description:"แม่สร. น้ำ + ไฟ",category:"Utilities"},
  {id:6,date:"23/1/69",amount:26.75,deduct:0,description:"สร. ไฟ",category:"Utilities"},
  {id:7,date:"10/2/69",amount:92.68,deduct:0,description:"สร. ไฟ",category:"Utilities"},
  {id:8,date:"12/2/69",amount:900,deduct:0,description:"สร. เหล็กสแลกลูก ๓จุก บนปลวกหม้อน้ำ",category:"Materials"},
  {id:9,date:"13/2/69",amount:1201.90,deduct:0,description:"สร. Net Php54",category:"Internet"},
  {id:10,date:"13/2/69",amount:2068,deduct:0,description:"สร. Net",category:"Internet"},
  {id:11,date:"21/2/69",amount:3010,deduct:0,description:"ค่าน้ำ + ไฟ",category:"Utilities"},
];
const PRESET_COLORS=["#f97316","var(--red)","#8b5cf6","var(--blue)","var(--green)","var(--blue)","#6b7280","#ec4899","#eab308","#14b8a6","#f43f5e","#a855f7"];
const MONTH_FULL=["","January","February","March","April","May","June","July","August","September","October","November","December"];
const MONTH_SHORT=["","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmt=n=>Number(n).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});
function load(k,d){try{const s=localStorage.getItem(k);return s?JSON.parse(s):d;}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function pm(d){return parseInt(d.split("/")[1]);}
function py(d){return parseInt(d.split("/")[2]);}

// ---- PDF with Thai font via canvas workaround ----
async function exportPDF(data, title, isSalary=false) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:"landscape",unit:"mm",format:"a4"});

  // Draw header background
  doc.setFillColor(31,78,121);
  doc.rect(0,0,297,22,"F");

  // Use canvas to render Thai text as image
  async function thaiText(text, fontSize, color="#ffffff") {
    const canvas = document.createElement("canvas");
    const scale = 3;
    canvas.width = 2000; canvas.height = fontSize * scale * 2;
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.font = `${fontSize*scale}px Sarabun, sans-serif`;
    ctx.fillStyle = color;
    ctx.fillText(text, 0, fontSize*scale*1.2);
    const w = ctx.measureText(text).width;
    // trim canvas
    const trimmed = document.createElement("canvas");
    trimmed.width = Math.ceil(w)+4; trimmed.height = canvas.height;
    trimmed.getContext("2d").drawImage(canvas,0,0);
    return {dataUrl: trimmed.toDataURL("image/png"), w: Math.ceil(w)/scale, h: fontSize*2.4};
  }

  // Header text
  let t = await thaiText(title, 14);
  doc.addImage(t.dataUrl,"PNG",14,3,Math.min(t.w,200),t.h*0.6);
  t = await thaiText(isSalary?"Salary Summary":"Expense Summaryเพื่อเบิกกับบริษัท", 9);
  doc.addImage(t.dataUrl,"PNG",14,13,Math.min(t.w,200),t.h*0.55);

  if(isSalary) {
    // Salary table headers
    const heads = [["#","Month","Expected","Paid","Diff","Note"]];
    const body = data.map((r,i)=>{
      const diff = Number(r.paid) - Number(r.expected);
      return [i+1, `${MONTH_FULL[r.month]} 20${r.year}`, fmt(r.expected), fmt(r.paid), diff>=0?`+${fmt(diff)}`:fmt(diff), r.note||""];
    });
    const tE=data.reduce((s,r)=>s+Number(r.expected),0);
    const tP=data.reduce((s,r)=>s+Number(r.paid),0);
    body.push(["","","TOTAL",fmt(tE),fmt(tP),""]);
    doc.autoTable({startY:28,head:heads,body,
      styles:{fontSize:10,cellPadding:3},
      headStyles:{fillColor:[46,117,182],textColor:205,fontStyle:"bold"},
      alternateRowStyles:{fillColor:[235,244,205]},
      columnStyles:{0:{cellWidth:8,halign:"center"},2:{halign:"right"},3:{halign:"right"},4:{halign:"right"}},
      didParseCell:(d)=>{if(d.row.index===data.length){d.cell.styles.fontStyle="bold";d.cell.styles.fillColor=[189,215,238];}}
    });
  } else {
    const tA=data.reduce((s,r)=>s+Number(r.amount),0);
    const tD=data.reduce((s,r)=>s+Number(r.deduct||0),0);
    const tN=tA-tD;
    const body=[...data.map((r,i)=>[i+1,r.date,r.description,r.category,fmt(r.amount),Number(r.deduct||0)>0?fmt(r.deduct):"-",fmt(Number(r.amount)-Number(r.deduct||0))]),
      ["","","","TOTAL",fmt(tA),tD>0?fmt(tD):"-",fmt(tN)]];
    doc.autoTable({startY:28,
      head:[["#","Date","Items","Category","Amount","Deduct","Net"]],
      body,
      styles:{fontSize:9,cellPadding:3},
      headStyles:{fillColor:[46,117,182],textColor:205,fontStyle:"bold"},
      alternateRowStyles:{fillColor:[235,244,205]},
      columnStyles:{0:{cellWidth:8,halign:"center"},1:{cellWidth:18},2:{cellWidth:82},3:{cellWidth:28},4:{cellWidth:30,halign:"right"},5:{cellWidth:30,halign:"right"},6:{cellWidth:30,halign:"right"}},
      didParseCell:(d)=>{if(d.row.index===data.length){d.cell.styles.fontStyle="bold";d.cell.styles.fillColor=[189,215,238];d.cell.styles.textColor=[0,0,0];}}
    });
    const pH=doc.internal.pageSize.height;
    doc.setFontSize(8); doc.setTextColor(120,120,120);
    const ft=await thaiText(`Net Total: ${fmt(tN)} THB`,8,"#666666");
    doc.addImage(ft.dataUrl,"PNG",180,pH-8,ft.w*0.7,ft.h*0.45);
  }
  doc.save(`${title}.pdf`);
}

function App(){
  const [rows,setRows]     = useState(()=>load(SK,defaultData));
  const [nextId,setNextId] = useState(()=>load(SI,12));
  const [cats,setCats]     = useState(()=>load(SC,defaultCats));
  const [salaries,setSalaries] = useState(()=>load(SS,[]));
  const [tab,setTab]       = useState("expense"); // expense | salary
  const [view,setView]     = useState("summary");
  const [showModal,setShowModal]       = useState(false);
  const [showCatModal,setShowCatModal] = useState(false);
  const [showSalModal,setShowSalModal] = useState(false);
  const [editRow,setEditRow]   = useState(null);
  const [editSal,setEditSal]   = useState(null);
  const [form,setForm]         = useState({date:"1/1/69",amount:"",deduct:"",description:"",category:""});
  const [salForm,setSalForm]   = useState({month:1,year:69,expected:"",paid:"",note:""});
  const [deleteId,setDeleteId] = useState(null);
  const [deleteSalId,setDeleteSalId] = useState(null);
  const [catForm,setCatForm]   = useState({name:"",color:"var(--blue)"});
  const [editCat,setEditCat]   = useState(null);
  const [deleteCat,setDeleteCat] = useState(null);
  const [toast,setToast]       = useState("");

  useEffect(()=>save(SK,rows),[rows]);
  useEffect(()=>save(SI,nextId),[nextId]);
  useEffect(()=>save(SC,cats),[cats]);
  useEffect(()=>save(SS,salaries),[salaries]);

  const catMap = useMemo(()=>{const m={};cats.forEach(c=>m[c.name]=c.color);return m;},[cats]);
  const showToast = msg=>{setToast(msg);setTimeout(()=>setToast(""),2000);};

  const monthGroups = useMemo(()=>{
    const map={};
    rows.forEach(r=>{const key=`${pm(r.date)}/${py(r.date)}`;if(!map[key])map[key]={month:pm(r.date),year:py(r.date),key,rows:[]};map[key].rows.push(r);});
    return Object.values(map).sort((a,b)=>a.year!==b.year?a.year-b.year:a.month-b.month);
  },[rows]);

  const totalAmount=rows.reduce((s,r)=>s+Number(r.amount),0);
  const totalDeduct=rows.reduce((s,r)=>s+Number(r.deduct||0),0);
  const totalNet=totalAmount-totalDeduct;

  // ---- Expense handlers ----
  const openAdd  = ()=>{setForm({date:"1/1/69",amount:"",deduct:"",description:"",category:cats[0]?.name||""});setEditRow(null);setShowModal(true);};
  const openEdit = r=>{setForm({date:r.date,amount:r.amount,deduct:r.deduct||0,description:r.description,category:r.category});setEditRow(r.id);setShowModal(true);};
  const saveForm = ()=>{
    if(!form.date||(!form.amount&&!form.deduct)||!form.description)return;
    if(editRow!==null){setRows(p=>p.map(r=>r.id===editRow?{...r,...form,amount:Number(form.amount||0),deduct:Number(form.deduct||0)}:r));showToast("✅ แก้ไขItemsแล้ว");}
    else{setRows(p=>[...p,{id:nextId,...form,amount:Number(form.amount||0),deduct:Number(form.deduct||0)}]);setNextId(p=>p+1);showToast("✅ Addแล้ว");}
    setShowModal(false);
  };

  // ---- Salary handlers ----
  const openAddSal  = ()=>{setSalForm({month:1,year:69,expected:"",paid:"",note:""});setEditSal(null);setShowSalModal(true);};
  const openEditSal = r=>{setSalForm({month:r.month,year:r.year,expected:r.expected,paid:r.paid,note:r.note||""});setEditSal(r.id);setShowSalModal(true);};
  const saveSalForm = ()=>{
    if(!salForm.expected||!salForm.paid)return;
    if(editSal!==null){setSalaries(p=>p.map(r=>r.id===editSal?{...r,...salForm,expected:Number(salForm.expected),paid:Number(salForm.paid)}:r));showToast("✅ Updated");}
    else{setSalaries(p=>[...p,{id:Date.now(),...salForm,expected:Number(salForm.expected),paid:Number(salForm.paid)}]);showToast("✅ AddเงินMonthแล้ว");}
    setShowSalModal(false);
  };

  // ---- Cat handlers ----
  const openEditCat = i=>{setCatForm({name:cats[i].name,color:cats[i].color});setEditCat(i);};
  const saveCat = ()=>{
    if(!catForm.name.trim())return;
    if(editCat!==null){const old=cats[editCat].name;setCats(p=>p.map((c,idx)=>idx===editCat?{...catForm}:c));setRows(p=>p.map(r=>r.category===old?{...r,category:catForm.name}:r));showToast("✅ แก้ไขCategoryแล้ว");}
    else{if(cats.find(c=>c.name===catForm.name.trim()))return;setCats(p=>[...p,{name:catForm.name.trim(),color:catForm.color}]);showToast("✅ เพิ่มCategoryแล้ว");}
    setEditCat(null);setCatForm({name:"",color:"var(--blue)"});
  };

  const currentMonthKey   = view.startsWith("month:")?view.replace("month:",""):null;
  const currentMonthGroup = currentMonthKey?monthGroups.find(g=>g.key===currentMonthKey):null;
  const detailRows        = currentMonthGroup?currentMonthGroup.rows:rows;
  const colGrid = "36px 78px 1fr 88px 88px 78px 78px 60px";

  function CatBadge({name}){const color=catMap[name]||"#6b7280";return <span style={{background:`${color}22`,color,borderRadius:6,padding:"2px 7px",fontSize:10,fontWeight:600,border:`1px solid ${color}44`}}>{name}</span>;}

  function DateDropdown({value,onChange}){
    const parts=(value||"1/1/69").split("/");
    const dd=parts[0]||"1",mm=parts[1]||"1",yy=parts[2]||"69";
    const set=(d,m,y)=>onChange(`${d}/${m}/${y}`);
    const sel={background:"var(--bg)",border:"1px solid rgba(205,205,205,0.12)",borderRadius:6,padding:"9px 8px",color:"var(--text)",fontSize:14,outline:"none",cursor:"pointer"};
    return(
      <div style={{marginBottom:11}}>
        <label style={{color:"var(--text2)",fontSize:12,display:"block",marginBottom:6}}>Date</label>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1.6fr 1fr",gap:8}}>
          <select value={dd} onChange={e=>set(e.target.value,mm,yy)} style={sel}>{Array.from({length:31},(_,i)=><option key={i+1} value={i+1}>{i+1}</option>)}</select>
          <select value={mm} onChange={e=>set(dd,e.target.value,yy)} style={sel}>{MONTH_SHORT.slice(1).map((m,i)=><option key={i+1} value={i+1}>{m}</option>)}</select>
          <select value={yy} onChange={e=>set(dd,mm,e.target.value)} style={sel}>{[{v:67,l:2024},{v:68,l:2025},{v:69,l:2026},{v:70,l:2027},{v:71,l:2028},{v:72,l:2029}].map(({v,l})=><option key={v} value={v}>{l}</option>)}</select>
        </div>
      </div>
    );
  }

  function RowTable({data,pdfTitle}){
    const tA=data.reduce((s,r)=>s+Number(r.amount),0);
    const tD=data.reduce((s,r)=>s+Number(r.deduct||0),0);
    const tN=tA-tD;
    return(<>
      <div style={{display:"flex",justifyContent:"flex-end",marginBottom:12}}>
        <button onClick={()=>exportPDF(data,pdfTitle)} style={{background:"var(--green)",color:"#fff",border:"none",borderRadius:6,padding:"9px 18px",fontSize:13,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",gap:6}}>📄 Export PDF</button>
      </div>
      <div style={{background:"rgba(205,205,205,0.04)",borderRadius:8,border:"1px solid rgba(205,205,205,0.08)",overflowX:"auto"}}>
        <div style={{display:"grid",gridTemplateColumns:colGrid,padding:"9px 12px",background:"rgba(205,205,205,0.06)",color:"var(--text2)",fontSize:10,fontWeight:600,letterSpacing:1,textTransform:"uppercase",borderBottom:"1px solid rgba(205,205,205,0.06)",minWidth:600}}>
          <div>#</div><div>Date</div><div>Items</div><div>Category</div><div style={{textAlign:"right"}}>Amount</div><div style={{textAlign:"right",color:"var(--red)"}}>Deduction</div><div style={{textAlign:"right",color:"var(--green)"}}>Net</div><div style={{textAlign:"center"}}>Action</div>
        </div>
        {data.map((r,i)=>{const net=Number(r.amount)-Number(r.deduct||0);return(
          <div key={r.id} className="row-item" style={{display:"grid",gridTemplateColumns:colGrid,padding:"10px 12px",alignItems:"center",borderBottom:"1px solid rgba(205,205,205,0.04)",background:i%2===0?"transparent":"rgba(205,205,205,0.02)",transition:"background .15s",minWidth:600}}>
            <div style={{color:"var(--text3)",fontSize:11}}>{i+1}</div>
            <div style={{color:"var(--text2)",fontSize:11}}>{r.date}</div>
            <div style={{color:"var(--text)",fontSize:12}}>{r.description}</div>
            <div><CatBadge name={r.category}/></div>
            <div style={{color:"var(--text)",fontSize:12,fontWeight:600,textAlign:"right"}}>฿{fmt(r.amount)}</div>
            <div style={{color:Number(r.deduct||0)>0?"var(--red)":"var(--text3)",fontSize:12,fontWeight:600,textAlign:"right"}}>{Number(r.deduct||0)>0?`-฿${fmt(r.deduct)}`:"-"}</div>
            <div style={{color:"var(--green)",fontSize:12,fontWeight:700,textAlign:"right"}}>฿{fmt(net)}</div>
            <div style={{display:"flex",gap:4,justifyContent:"center"}}>
              <button onClick={()=>openEdit(r)} style={{background:"var(--surface2)",color:"var(--blue)",border:"1px solid #3b82f630",borderRadius:7,width:26,height:26,cursor:"pointer",fontSize:12}}>✏️</button>
              <button onClick={()=>setDeleteId(r.id)} style={{background:"rgba(255,59,59,0.08)",color:"var(--red)",border:"1px solid #ef444430",borderRadius:7,width:26,height:26,cursor:"pointer",fontSize:12}}>🗑</button>
            </div>
          </div>
        );})}
        <div style={{display:"grid",gridTemplateColumns:colGrid,padding:"11px 12px",background:"#111",borderTop:"1px solid var(--border)",minWidth:600}}>
          <div/><div/><div style={{color:"#555",fontWeight:700,fontSize:12}}>TOTAL</div><div/>
          <div style={{color:"var(--blue)",fontWeight:700,fontSize:13,textAlign:"right"}}>฿{fmt(tA)}</div>
          <div style={{color:"var(--red)",fontWeight:700,fontSize:13,textAlign:"right"}}>{tD>0?`-฿${fmt(tD)}`:"-"}</div>
          <div style={{color:"var(--green)",fontWeight:700,fontSize:14,textAlign:"right"}}>฿{fmt(tN)}</div>
          <div/>
        </div>
      </div>
    </>);
  }

  // ---- SALARY VIEW ----
  function SalaryView(){
    const totalExpected = salaries.reduce((s,r)=>s+Number(r.expected),0);
    const totalPaid     = salaries.reduce((s,r)=>s+Number(r.paid),0);
    const totalDiff     = totalPaid - totalExpected;
    const sorted = [...salaries].sort((a,b)=>a.year!==b.year?a.year-b.year:a.month-b.month);
    return(
      <div>
        {/* Cards */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:20}}>
          {[
            {label:"Expected Total",value:`฿${fmt(totalExpected)}`,accent:"var(--blue)"},
            {label:"Paid Total",   value:`฿${fmt(totalPaid)}`,   accent:"var(--green)"},
            {label:totalDiff>=0?"Surplus":"Deficit",value:`${totalDiff>=0?"+":""}฿${fmt(Math.abs(totalDiff))}`,accent:totalDiff>=0?"var(--green)":"var(--red)"},
          ].map((c,i)=>(
            <div key={i} style={{background:"rgba(205,205,205,0.05)",borderRadius:8,padding:"12px 14px",border:`1px solid ${c.accent}44`}}>
              <div style={{color:"var(--text2)",fontSize:10,marginBottom:4}}>{c.label}</div>
              <div style={{color:c.accent,fontSize:15,fontWeight:700}}>{c.value}</div>
            </div>
          ))}
        </div>

        {/* Export */}
        <div style={{display:"flex",justifyContent:"flex-end",marginBottom:12}}>
          <button onClick={()=>exportPDF(sorted,"Salary Summary",true)} style={{background:"var(--green)",color:"#fff",border:"none",borderRadius:6,padding:"9px 18px",fontSize:13,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",gap:6}}>📄 Export PDF</button>
        </div>

        {/* List */}
        {sorted.length===0?(
          <div style={{textAlign:"center",color:"var(--text3)",padding:"40px 0",fontSize:14}}>ยังไม่มีItemsเงินMonth<br/>กด "+ Add" เพื่อเริ่มต้น</div>
        ):(
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            {sorted.map(r=>{
              const diff=Number(r.paid)-Number(r.expected);
              const pct=Number(r.expected)>0?Math.round((Number(r.paid)/Number(r.expected))*100):0;
              return(
                <div key={r.id} style={{background:"rgba(205,205,205,0.05)",borderRadius:8,padding:"16px 18px",border:`1px solid ${diff>=0?"rgba(52,211,153,0.2)":"rgba(248,113,113,0.2)"}`}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                    <div style={{color:"var(--text)",fontWeight:700,fontSize:15}}>{MONTH_FULL[r.month]} 20{r.year}</div>
                    <div style={{display:"flex",gap:6,alignItems:"center"}}>
                      <span style={{background:diff>=0?"rgba(0,232,122,0.06)":"rgba(255,59,59,0.06)",color:diff>=0?"var(--green)":"var(--red)",borderRadius:6,padding:"3px 10px",fontSize:12,fontWeight:700,border:`1px solid ${diff>=0?"var(--border2)":"#f8717144"}`}}>
                        {diff>=0?`+${fmt(diff)}`:fmt(diff)} THB
                      </span>
                      <button onClick={()=>openEditSal(r)} style={{background:"var(--surface2)",color:"var(--blue)",border:"1px solid #3b82f630",borderRadius:7,width:28,height:28,cursor:"pointer",fontSize:12}}>✏️</button>

                    </div>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
                    <div style={{background:"var(--surface2)",borderRadius:6,padding:"10px 12px"}}>

                      <div style={{color:"var(--blue)",fontWeight:700,fontSize:15}}>฿{fmt(r.expected)}</div>
                    </div>
                    <div style={{background:diff>=0?"rgba(0,232,122,0.04)":"rgba(255,59,59,0.04)",borderRadius:6,padding:"10px 12px"}}>

                      <div style={{color:diff>=0?"var(--green)":"var(--red)",fontWeight:700,fontSize:15}}>฿{fmt(r.paid)}</div>
                    </div>
                  </div>
                  {/* Progress */}
                  <div style={{marginBottom: r.note?10:0}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                      <span style={{color:"var(--text2)",fontSize:10}}>Paid {pct}%</span>
                      <span style={{color:diff>=0?"var(--green)":"var(--red)",fontSize:10,fontWeight:600}}>{diff>=0?"Fully Paid ✓":`Short ฿${fmt(Math.abs(diff))}`}</span>
                    </div>
                    <div style={{height:6,background:"rgba(205,205,205,0.08)",borderRadius:3,overflow:"hidden"}}>
                      <div style={{height:"100%",width:`${Math.min(pct,100)}%`,background:diff>=0?"var(--green)":"var(--red)",borderRadius:3,transition:"width .3s"}}/>
                    </div>
                  </div>
                  {r.note&&<div style={{color:"var(--text2)",fontSize:11,marginTop:8}}>📝 {r.note}</div>}
                </div>
              );
            })}
          </div>
        )}
      </div>
    );
  }

  return(
    <div style={{minHeight:"100vh",padding:"32px 20px 60px"}}>
      <div style={{maxWidth:880,margin:"0 auto"}}>

        {toast&&<div style={{position:"fixed",top:20,left:"50%",transform:"translateX(-50%)",background:"var(--surface)",color:"var(--green)",border:"1px solid #34d39944",borderRadius:6,padding:"10px 24px",fontSize:14,fontWeight:600,zIndex:999,boxShadow:"0 8px 30px rgba(0,0,0,0.4)"}}>{toast}</div>}

        {/* ---- NAV TABS ---- */}
        <div style={{display:"flex",gap:8,marginBottom:20,background:"rgba(205,205,205,0.04)",borderRadius:8,padding:6,border:"1px solid rgba(205,205,205,0.08)"}}>
          {[{id:"expense",label:"💸 Expenses"},{id:"salary",label:"💰 Salary"}].map(t=>(
            <button key={t.id} onClick={()=>{setTab(t.id);setView("summary");}} className="nav-tab"
              style={{flex:1,padding:"14px 0",borderRadius:0,fontSize:12,fontWeight:600,color:tab===t.id?"var(--accent)":"var(--text2)",letterSpacing:1,fontSize:12,textTransform:"uppercase",fontWeight:tab===t.id?600:400,background:"transparent",boxShadow:"none",borderBottom:tab===t.id?"2px solid var(--accent)":"2px solid transparent",marginBottom:"-1px",transition:"all .2s"}}>

        </div>

        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:18,flexWrap:"wrap",gap:10}}>

            <div>
              <div style={{color:"var(--text2)",fontSize:10,letterSpacing:3,textTransform:"uppercase"}}>{tab==="expense"?"Expense Summary":"Salary Account"}</div>

                {tab==="salary"?"Salary Summary":view==="summary"?"Monthly Overview":view==="all"?"All Records":`${MONTH_FULL[currentMonthGroup?.month||1]} 20${currentMonthGroup?.year||69}`}
              </h1>
            </div>
          </div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            {tab==="expense"&&view==="summary"&&<>
              <button onClick={()=>setShowCatModal(true)} style={{background:"var(--surface2)",color:"var(--text2)",border:"1px solid var(--border2)",borderRadius:6,padding:"9px 12px",fontSize:13,fontWeight:600,cursor:"pointer"}}>🏷️ Category</button>
              <button onClick={()=>exportPDF(rows,"All Expenses")} style={{background:"var(--green)",color:"#fff",border:"none",borderRadius:6,padding:"9px 12px",fontSize:13,fontWeight:600,cursor:"pointer"}}>📄 Export</button>
            </>}
            <button onClick={tab==="expense"?openAdd:openAddSal} style={{background:"var(--accent)",color:"#000",border:"none",borderRadius:6,padding:"9px 18px",fontSize:12,fontWeight:600,cursor:"pointer",letterSpacing:1,textTransform:"uppercase"}}>+ Add</button>
          </div>
        </div>

        {/* ---- EXPENSE TAB ---- */}
        {tab==="expense"&&(<>
          {view==="summary"&&(<>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:20}}>
              {[{label:"Amount Total",value:`฿${fmt(totalAmount)}`,accent:"var(--blue)"},{label:"Deduction",value:`฿${fmt(totalDeduct)}`,accent:"var(--red)"},{label:"Net Total",value:`฿${fmt(totalNet)}`,accent:"var(--green)"}]
                .map((c,i)=><div key={i} style={{background:"rgba(205,205,205,0.05)",borderRadius:8,padding:"12px 14px",border:`1px solid ${c.accent}44`}}><div style={{color:"var(--text2)",fontSize:10,marginBottom:4}}>{c.label}</div><div style={{color:c.accent,fontSize:15,fontWeight:700}}>{c.value}</div></div>)}
            </div>
            <div style={{color:"var(--text2)",fontSize:11,letterSpacing:2,textTransform:"uppercase",marginBottom:10}}>Monthly Summary</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:12,marginBottom:18}}>
              {monthGroups.map(g=>{
                const tA=g.rows.reduce((s,r)=>s+Number(r.amount),0);
                const tD=g.rows.reduce((s,r)=>s+Number(r.deduct||0),0);
                const tN=tA-tD;
                const pct=tA>0?Math.round((tD/tA)*100):0;
                return(
                  <div key={g.key} className="month-card" onClick={()=>setView(`month:${g.key}`)} style={{background:"rgba(205,205,205,0.05)",borderRadius:8,padding:"16px 18px",border:"1px solid rgba(205,205,205,0.1)"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                      <div style={{color:"var(--text)",fontWeight:700,fontSize:15}}>{MONTH_FULL[g.month]} 20{g.year}</div>
                      <span style={{background:"var(--surface2)",color:"var(--blue)",borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:600}}>{g.rows.length} Items</span>

                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
                      <div style={{background:"var(--surface2)",borderRadius:6,padding:"8px 10px"}}><div style={{color:"var(--text2)",fontSize:10,marginBottom:2}}>Amount</div><div style={{color:"var(--blue)",fontWeight:700,fontSize:13}}>฿{fmt(tA)}</div></div>
                      <div style={{background:"rgba(255,59,59,0.06)",borderRadius:6,padding:"8px 10px"}}><div style={{color:"var(--text2)",fontSize:10,marginBottom:2}}>Deduction</div><div style={{color:"var(--red)",fontWeight:700,fontSize:13}}>{tD>0?`฿${fmt(tD)}`:"-"}</div></div>
                    </div>
                    <div style={{background:"var(--surface2)",borderRadius:6,padding:"8px 12px",border:"1px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>

                      <span style={{color:"var(--green)",fontWeight:700,fontSize:15}}>฿{fmt(tN)}</span>

        </>)}

        {tab==="salary"&&<SalaryView/>}

                  style={{width:"100%",background:"rgba(205,205,205,0.07)",border:`1px solid ${f.key==="deduct"?"rgba(239,68,68,0.3)":"rgba(205,205,205,0.12)"}`,borderRadius:6,padding:"9px 12px",color:"var(--text)",fontSize:14,outline:"none"}}/>
              </div>

            <div style={{marginBottom:16}}>
              <label style={{color:"var(--text2)",fontSize:12,display:"block",marginBottom:4}}>Category</label>

                {cats.map(c=><option key={c.name} value={c.name}>{c.name}</option>)}
              </select>
            </div>
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>setShowModal(false)} style={{flex:1,background:"rgba(205,205,205,0.06)",color:"var(--text2)",border:"1px solid rgba(205,205,205,0.1)",borderRadius:6,padding:"10px 0",fontSize:14,cursor:"pointer"}}>Cancel</button>
              <button onClick={saveForm} style={{flex:2,background:"var(--blue)",color:"#fff",border:"none",borderRadius:6,padding:"10px 0",fontSize:14,fontWeight:700,cursor:"pointer"}}>{editRow?"Save":"Add"}</button>
            </div>
          </div>
        </div>
      )}

      {/* ===== SALARY MODAL ===== */}
      {showSalModal&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.92)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:16}}>
          <div style={{background:"var(--surface)",borderRadius:6,padding:24,width:"min(92vw,420px)",border:"1px solid var(--green)",boxShadow:"0 20px 60px rgba(0,0,0,0.7)"}}>
            <h2 style={{color:"var(--text)",fontWeight:700,fontSize:17,marginBottom:16}}>💰 {editSal?"แก้ไขเงินMonth":"AddเงินMonth"}</h2>
            <div style={{marginBottom:12}}>
              <label style={{color:"var(--text2)",fontSize:12,display:"block",marginBottom:6}}>Month / ปี</label>
              <div style={{display:"grid",gridTemplateColumns:"1.6fr 1fr",gap:8}}>
                <select value={salForm.month} onChange={e=>setSalForm({...salForm,month:parseInt(e.target.value)})} style={{background:"var(--bg)",border:"1px solid rgba(205,205,205,0.12)",borderRadius:6,padding:"9px 10px",color:"var(--text)",fontSize:14,outline:"none"}}>
                  {MONTH_FULL.slice(1).map((m,i)=><option key={i+1} value={i+1}>{m}</option>)}
                </select>
                <select value={salForm.year} onChange={e=>setSalForm({...salForm,year:parseInt(e.target.value)})} style={{background:"var(--bg)",border:"1px solid rgba(205,205,205,0.12)",borderRadius:6,padding:"9px 10px",color:"var(--text)",fontSize:14,outline:"none"}}>
                  {[{v:67,l:2024},{v:68,l:2025},{v:69,l:2026},{v:70,l:2027},{v:71,l:2028},{v:72,l:2029}].map(({v,l})=><option key={v} value={v}>{l}</option>)}
                </select>
              </div>
            </div>
            {[{label:"Expected (THB)",key:"expected",color:"var(--blue)"},{label:"Paid (THB)",key:"paid",color:"var(--green)"},{label:"Note (ถ้ามี)",key:"note",color:"var(--text2)"}].map(f=>(
              <div key={f.key} style={{marginBottom:11}}>
                <label style={{color:f.color,fontSize:12,display:"block",marginBottom:4}}>{f.label}</label>
                <input type={f.key==="note"?"text":"number"} value={salForm[f.key]} placeholder={f.key==="note"?"e.g. Partial payment...":"0.00"} onChange={e=>setSalForm({...salForm,[f.key]:e.target.value})}
                  style={{width:"100%",background:"rgba(205,205,205,0.07)",border:`1px solid ${f.color}44`,borderRadius:6,padding:"9px 12px",color:"var(--text)",fontSize:14,outline:"none"}}/>
              </div>
            ))}
            {/* Preview diff */}
            {salForm.expected&&salForm.paid&&(()=>{
              const diff=Number(salForm.paid)-Number(salForm.expected);
              return <div style={{background:diff>=0?"rgba(52,211,153,0.1)":"rgba(248,113,113,0.1)",borderRadius:6,padding:"10px 14px",marginBottom:14,border:`1px solid ${diff>=0?"var(--border2)":"#f8717144"}`}}>
                <span style={{color:"var(--text2)",fontSize:12}}>Difference: </span>
                <span style={{color:diff>=0?"var(--green)":"var(--red)",fontWeight:700,fontSize:14}}>{diff>=0?`+${fmt(diff)}`:fmt(diff)} THB {diff>=0?"✓ Full":"⚠ Short"}</span>
              </div>;
            })()}
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>setShowSalModal(false)} style={{flex:1,background:"rgba(205,205,205,0.06)",color:"var(--text2)",border:"1px solid rgba(205,205,205,0.1)",borderRadius:6,padding:"10px 0",fontSize:14,cursor:"pointer"}}>Cancel</button>
              <button onClick={saveSalForm} style={{flex:2,background:"var(--green)",color:"#fff",border:"none",borderRadius:6,padding:"10px 0",fontSize:14,fontWeight:700,cursor:"pointer"}}>{editSal?"Save":"Add"}</button>
            </div>
          </div>
        </div>
      )}

      {/* ===== CAT MODAL ===== */}
      {showCatModal&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.92)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:16}}>

            </div>
            <div style={{background:"rgba(205,205,205,0.04)",borderRadius:8,padding:16,marginBottom:18,border:"1px solid rgba(205,205,205,0.08)"}}>
              <div style={{color:"var(--text2)",fontSize:12,marginBottom:10}}>{editCat!==null?"แก้ไขCategory":"เพิ่มCategoryใหม่"}</div>
              <input value={catForm.name} placeholder="Category name..." onChange={e=>setCatForm({...catForm,name:e.target.value})} style={{width:"100%",background:"rgba(205,205,205,0.07)",border:"1px solid rgba(205,205,205,0.12)",borderRadius:6,padding:"9px 12px",color:"var(--text)",fontSize:14,outline:"none",marginBottom:12}}/>
              <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}>
                {PRESET_COLORS.map(c=><button key={c} onClick={()=>setCatForm({...catForm,color:c})} style={{width:28,height:28,borderRadius:"50%",background:c,border:catForm.color===c?"3px solid #fff":"2px solid transparent",cursor:"pointer"}}/>)}

              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
                <span style={{color:"var(--text2)",fontSize:11}}>Preview:</span>
                <span style={{background:`${catForm.color}22`,color:catForm.color,borderRadius:6,padding:"3px 12px",fontSize:12,fontWeight:600,border:`1px solid ${catForm.color}44`}}>{catForm.name||"Category"}</span>
              </div>
              <div style={{display:"flex",gap:8}}>
                {editCat!==null&&<button onClick={()=>{setEditCat(null);setCatForm({name:"",color:"var(--blue)"});}} style={{flex:1,background:"rgba(205,205,205,0.06)",color:"var(--text2)",border:"1px solid rgba(205,205,205,0.1)",borderRadius:6,padding:"9px 0",fontSize:13,cursor:"pointer"}}>Cancel</button>}
                <button onClick={saveCat} style={{flex:2,background:"#333",color:"#fff",border:"none",borderRadius:6,padding:"9px 0",fontSize:13,fontWeight:700,cursor:"pointer"}}>{editCat!==null?"Save Changes":"+ เพิ่มCategory"}</button>
              </div>
            </div>
            <div style={{color:"var(--text2)",fontSize:11,marginBottom:10}}>All Categories ({cats.length})</div>
            {cats.map((c,idx)=>(
              <div key={idx} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 14px",background:editCat===idx?"var(--surface2)":"rgba(205,205,205,0.03)",borderRadius:6,marginBottom:6,border:editCat===idx?"1px solid var(--border2)":"1px solid transparent"}}>
                <span style={{background:`${c.color}22`,color:c.color,borderRadius:6,padding:"3px 12px",fontSize:12,fontWeight:600,border:`1px solid ${c.color}44`}}>{c.name}</span>
                <div style={{display:"flex",gap:6}}>
                  <button onClick={()=>openEditCat(idx)} style={{background:"var(--surface2)",color:"var(--blue)",border:"1px solid #3b82f630",borderRadius:7,width:28,height:28,cursor:"pointer",fontSize:12}}>✏️</button>
                  <button onClick={()=>setDeleteCat(idx)} style={{background:"rgba(255,59,59,0.08)",color:"var(--red)",border:"1px solid #ef444430",borderRadius:7,width:28,height:28,cursor:"pointer",fontSize:12}}>🗑</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {deleteId!==null&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.92)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200}}>
          <div style={{background:"var(--surface)",borderRadius:6,padding:24,width:"min(90vw,320px)",border:"1px solid var(--red)",textAlign:"center"}}>
            <div style={{fontSize:34,marginBottom:8}}>🗑️</div>

              <button onClick={()=>setDeleteId(null)} style={{flex:1,background:"rgba(205,205,205,0.06)",color:"var(--text2)",border:"none",borderRadius:6,padding:"10px 0",fontSize:14,cursor:"pointer"}}>Cancel</button>

            </div>
          </div>
        </div>
      )}

      {/* Delete salary */}
      {deleteSalId!==null&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.92)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200}}>
          <div style={{background:"var(--surface)",borderRadius:6,padding:24,width:"min(90vw,320px)",border:"1px solid var(--red)",textAlign:"center"}}>

            </div>
          </div>
        </div>

            <div style={{fontSize:34,marginBottom:8}}>🏷️</div>
            <h3 style={{color:"var(--text)",marginBottom:6,fontSize:16}}>DeleteCategory "{cats[deleteCat]?.name}"?</h3>
            <p style={{color:"var(--text2)",fontSize:12,marginBottom:16}}>Itemsที่ใช้Categoryนี้จะยังคงอยู่</p>
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>setDeleteCat(null)} style={{flex:1,background:"rgba(205,205,205,0.06)",color:"var(--text2)",border:"none",borderRadius:6,padding:"10px 0",fontSize:14,cursor:"pointer"}}>Cancel</button>
              <button onClick={()=>{setCats(p=>p.filter((_,i)=>i!==deleteCat));setDeleteCat(null);showToast("🗑️ DeleteCategoryแล้ว");}} style={{flex:1,background:"var(--red)",color:"#fff",border:"none",borderRadius:6,padding:"10px 0",fontSize:14,fontWeight:700,cursor:"pointer"}}>Delete</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
